services:
  frontend:
    build:
      context: ./
      dockerfile: ./services/frontend/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./services/frontend/src:/usr/share/nginx/html
  orchestrator:
    build:
      context: ./
      dockerfile: ./services/orchestrator/Dockerfile
    ports:
      - 8081:5000
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/services/orchestrator/src/app.py
      - OTEL_SERVICE_NAME=orchestrator
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://observability:4318
    volumes:
      - ./utils:/app/utils
      - ./services/orchestrator/src:/app/services/orchestrator/src
      - ./services/orchestrator/tests:/app/services/orchestrator/tests
  fraud_detection:
    build:
      context: ./
      dockerfile: ./services/fraud_detection/Dockerfile
    ports:
      - 50051:50051
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/services/fraud_detection/src/app.py
    volumes:
      - ./utils:/app/utils
      - ./services/fraud_detection/src:/app/services/fraud_detection/src
      - ./services/fraud_detection/tests:/app/services/fraud_detection/tests
  transaction_verification:
    build:
      context: ./
      dockerfile: ./services/transaction_verification/Dockerfile
    ports:
      - 50052:50052
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/services/transaction_verification/src/app.py
    volumes:
      - ./utils:/app/utils
      - ./services/transaction_verification/src:/app/services/transaction_verification/src
      - ./services/transaction_verification/tests:/app/services/transaction_verification/tests
  suggestions:
    build:
      context: ./
      dockerfile: ./services/suggestions/Dockerfile
    ports:
      - 50053:50053
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/services/suggestions/src/app.py
    volumes:
      - ./utils:/app/utils
      - ./services/suggestions/src:/app/services/suggestions/src
      - ./services/suggestions/tests:/app/services/suggestions/tests
  order_queue:
    build:
      context: ./
      dockerfile: ./services/order_queue/Dockerfile
    ports:
      - 50054:50054
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/services/order_queue/src/app.py
    volumes:
      - ./utils:/app/utils
      - ./services/order_queue/src:/app/services/order_queue/src
      - ./services/order_queue/tests:/app/services/order_queue/tests
  order_executor:
    build:
      context: ./
      dockerfile: ./services/order_executor/Dockerfile
    environment:
      - DB_HOST=books_database_primary:50056
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/services/order_executor/src/app.py
      - QUEUE_HOST=order_queue:50054
    volumes:
      - ./utils:/app/utils
      - ./services/order_executor/src:/app/services/order_executor/src
    depends_on:
      - order_queue
    deploy:
      replicas: 2
  payment:
    build:
      context: ./
      dockerfile: ./services/payment/Dockerfile
    ports:
      - 50055:50055
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/services/payment/src/app.py
      - PAYMENT_PORT=50055
    volumes:
      - ./utils:/app/utils
      - ./services/payment/src:/app/services/payment/src
      - ./services/payment/tests:/app/services/payment/tests
  books_database_primary:
    build:
      context: ./
      dockerfile: ./services/books_database/Dockerfile
    ports:
      - 50056:50056
    environment:
      - PYTHONUNBUFFERED=TRUE
      - DB_PORT=50056
      - DB_ROLE=primary
      - BACKUP_HOSTS=books_database_backup1:50057,books_database_backup2:50058
    volumes:
      - ./utils:/app/utils
      - ./services/books_database/src:/app/services/books_database/src
  books_database_backup1:
    build:
      context: ./
      dockerfile: ./services/books_database/Dockerfile
    ports:
      - 50057:50057
    environment:
      - PYTHONUNBUFFERED=TRUE
      - DB_PORT=50057
      - DB_ROLE=backup
    volumes:
      - ./utils:/app/utils
      - ./services/books_database/src:/app/services/books_database/src
  books_database_backup2:
    build:
      context: ./
      dockerfile: ./services/books_database/Dockerfile
    ports:
      - 50058:50058
    environment:
      - PYTHONUNBUFFERED=TRUE
      - DB_PORT=50058
      - DB_ROLE=backup
    volumes:
      - ./utils:/app/utils
      - ./services/books_database/src:/app/services/books_database/src

  observability:
    image: grafana/otel-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=1000

  locust:
    build:
      context: ./
      dockerfile: ./services/locust/Dockerfile
    ports:
      - "8089:8089"
    environment:
      - PYTHONUNBUFFERED=TRUE
    volumes:
      - ./services/locust/locustfile.py:/app/locustfile.py
    depends_on:
      - orchestrator
    command: sh -c "sleep 10 && locust -f /app/locustfile.py --host=http://orchestrator:5000 -u 5 -r 1 --headless"

